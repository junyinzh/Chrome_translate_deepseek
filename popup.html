<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PageLingo</title><link rel="stylesheet" href="ui.css"></head>
<body class="popup">
  <header><div class="brand"><div class="brand-mark">文</div><div><div class="brand-name">PageLingo</div><div class="brand-sub">POWERED BY DEEPSEEK</div></div></div><button id="settings" class="icon-button" title="设置" aria-label="打开设置"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="#f4f7f4"/><circle cx="15" cy="17" r="3" fill="#f4f7f4"/></svg></button></header>
  <div class="eyebrow">READ IN YOUR LANGUAGE</div><h1>让网页，用你的语言。</h1><p class="intro">直接替换页面文字，保留熟悉的布局。<br>阅读结束，随时恢复原文。</p>
  <div class="row"><div class="field"><label for="language">翻译成</label><select id="language"><option value="zh-Hans">简体中文</option><option value="zh-Hant">繁體中文</option><option value="en">English</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="ja">日本語</option><option value="es">Español</option></select></div><div class="field"><label for="scope">翻译范围</label><select id="scope"><option value="page">整个页面</option><option value="viewport">当前可见内容</option></select></div></div>
  <section class="status-card"><div class="status-heading"><span id="dot" class="dot"></span><span id="status" role="status">正在读取设置…</span></div><div class="progress-track"><div id="progress" class="progress-fill"></div></div><div id="detail" class="status-detail">稍等片刻</div></section>
  <label class="checkbox-line follow-control"><input id="follow-links" type="checkbox" disabled><span><b>点开链接后自动翻译</b><small id="follow-hint">当前页及从它打开的页面。关闭会停止这组页面的自动翻译。</small></span></label>
  <div id="error" class="message error" role="alert" hidden></div>
  <div class="actions"><button id="translate" class="button primary" disabled>翻译网页</button><button id="restore" class="button" disabled>恢复原文</button></div>
  <footer><span id="site" class="site">当前网页</span><span id="model">DeepSeek</span></footer>
  <script type="module" src="popup.js"></script>
</body></html>
